    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Russo+One&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="/home/joinsquad-1-wetlands.jpg" as="image" />
    <title>CompTactic</title>
    <script>
      try {
        var t = localStorage.getItem('comptactic-ui-theme')
        document.documentElement.dataset.uiTheme = t === 'amber' || t === 'blue' || t === 'steel' ? t : 'red'
      } catch (e) {
        document.documentElement.dataset.uiTheme = 'red'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
